<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 적용 방식</title>
    <style>
        .style-1 {
            color: olivedrab
            
        }
    </style>
</head>
<body bgcolor="5f5f5f">
    <h1>CSS를 적용하는 세 가지 방법</h1>
    <P>
        <b style="color: tomato">인라인 스타일
            (inline style)</b>
    </P>
    <p>
        <b class=""style-1>내부 스타일 시트(internal style 
            sheet)</b>
    </p>
    <p>
        <b class="style-2">링킹 스타일 
            시트(linking style sheet)</b>
    </p>
    
</body>
</html>
