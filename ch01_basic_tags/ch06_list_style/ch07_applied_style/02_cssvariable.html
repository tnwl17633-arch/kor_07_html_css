<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"href="./02_csvariable.css">
</head>
<body>
    <p>
        <u class="not good">
              제목 부분입니다.
        </u>
    <br>
     <u class="not good">
        u태그의 not good을 적용한 부분입니다.
     </u>
     <br>
     <u class="wrong">
        u태그의 wrong을 적용한 부분입니다.
     </u>   
    </p>
    <p>
      <i>
        u태그가 아닌 공통 부분의 not good을 적용한 부분입니다.
      </i>
      <b>
        u태그가 아닌 공통 부분의 not good을 적용한
        부분입니다.
      </b>  
    </p>  
</body>
</html>
